<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>test3 fireflies only</title>
  <style>
    body {
      margin: 0;
      padding: 45vh 0;
      color: #fff;
      font-family: sans-serif;
      font-size: 20px;
      line-height: 2.2;
      text-align: center;
    }
    main { position: relative; z-index: 2; }
    body { background: #071a10; }
    .fly {
      position: fixed;
      z-index: 3;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff6b0 0 2px, rgba(255, 233, 138, 0.5) 4px, rgba(255, 233, 138, 0) 8px);
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
      animation-name: blink;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 0; transform: translateY(0); }
      45% { opacity: 1; }
      55% { opacity: 0.9; }
      70% { opacity: 0.15; transform: translateY(-6px); }
    }

  </style>
</head>
