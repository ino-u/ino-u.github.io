<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ino-u</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
      font-size: 2rem;
      line-height: 1.4;
      color: #f4f7f0;
      background: #04140c url("jungle-bg.webp") center / cover no-repeat fixed;
      overflow: hidden;
    }

    /* 中央の文字を読みやすくする、うっすらした闇 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(2, 12, 7, 0.55), transparent 70%);
      pointer-events: none;
    }

    .fly {
      position: fixed;
      z-index: 1;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffe98a;
      box-shadow: 0 0 8px 3px rgba(255, 223, 107, 0.6);
      opacity: 0;
      pointer-events: none;
      animation-name: blink;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; transform: translateY(0); }
      45% { opacity: 1; }
      55% { opacity: 0.9; }
      70% { opacity: 0.15; transform: translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fly {
        animation: none;
        opacity: 0.55;
      }
    }

    main {
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 10px #000, 0 0 26px rgba(46, 139, 82, 0.4);
    }
  </style>
</head>
<body>
  <span class="fly" style="left:12%;top:24%;animation-duration:3.8s;animation-delay:-0.7s"></span>
  <span class="fly" style="left:22%;top:58%;animation-duration:4.6s;animation-delay:-2.1s"></span>
  <span class="fly" style="left:31%;top:36%;animation-duration:3.1s;animation-delay:-1.3s"></span>
  <span class="fly" style="left:43%;top:70%;animation-duration:5.2s;animation-delay:-3.8s"></span>
  <span class="fly" style="left:56%;top:28%;animation-duration:4.1s;animation-delay:-0.2s"></span>
  <span class="fly" style="left:64%;top:62%;animation-duration:3.5s;animation-delay:-2.9s"></span>
  <span class="fly" style="left:73%;top:42%;animation-duration:4.9s;animation-delay:-1.7s"></span>
  <span class="fly" style="left:84%;top:30%;animation-duration:3.3s;animation-delay:-4.4s"></span>
  <span class="fly" style="left:89%;top:66%;animation-duration:5.5s;animation-delay:-0.9s"></span>
  <span class="fly" style="left:8%;top:74%;animation-duration:4.3s;animation-delay:-3.1s"></span>
  <span class="fly" style="left:49%;top:84%;animation-duration:3.9s;animation-delay:-2.4s"></span>
  <span class="fly" style="left:95%;top:48%;animation-duration:4.7s;animation-delay:-5.2s"></span>
  <main>ino-u</main>
</body>
</html>
